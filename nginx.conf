# Static Craft App Suite: launcher at /, each app at /<slug>/ (see build.py).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind `-p 8080:80`, redirects like /fig -> /fig/ must keep the browser's host and port.
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/wasm text/javascript application/javascript application/json text/css image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    # Pages revalidate; hashed .wasm/.js are cached forever.
    add_header Cache-Control "no-cache" always;

    location ^~ /_local/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(wasm|js)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
