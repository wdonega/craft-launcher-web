# One release of this project per craft-launcher release, with the same number:
# craft-launcher v0.14.1 -> tag v0.14.1 here + image ghcr.io/<owner>/craft-launcher-web:0.14.1.
# Runs every 2 hours (builds only when the launcher has a release this repo doesn't) or by hand.
name: release

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      launcher_tag:
        description: "craft-launcher tag (empty: the latest)"
        required: false
      force:
        description: "Rebuild even if this version was already released (e.g. apps got updates)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release

env:
  LAUNCHER_REPO: storytold/craft-launcher
  TRUNK_VERSION: v0.22.1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pick the launcher version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.launcher_tag }}
          FORCE: ${{ inputs.force }}
        run: |
          latest=$(gh release view -R "$LAUNCHER_REPO" --json tagName -q .tagName)
          tag="${INPUT_TAG:-$latest}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "is_latest=$([ "$tag" = "$latest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$FORCE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$tag is already released here; nothing to do."
          fi

      - if: steps.v.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - if: steps.v.outputs.skip != 'true'
        name: Install trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/$TRUNK_VERSION/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - if: steps.v.outputs.skip != 'true'
        name: Build the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 build.py --launcher-tag "${{ steps.v.outputs.tag }}" --require-patch

      - if: steps.v.outputs.skip != 'true'
        name: Image tags
        id: img
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:${{ steps.v.outputs.version }}"
          [ "${{ steps.v.outputs.is_latest }}" = "true" ] && tags="$tags,$image:latest"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - if: steps.v.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v4
      - if: steps.v.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.v.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: steps.v.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          # Every platform nginx:alpine is published for. The image only copies files (no RUN),
          # so the extra platforms need no emulation and cost almost no build time.
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7,linux/arm/v6,linux/386,linux/ppc64le,linux/riscv64,linux/s390x
          push: true
          tags: ${{ steps.img.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}

      - if: steps.v.outputs.skip != 'true'
        name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          python3 - > notes.md <<'PY'
          import json, os
          m = json.load(open("site/_local/apps.json"))
          image = "ghcr.io/" + os.environ["GITHUB_REPOSITORY"].lower()
          print(f"craft-launcher {m['launcher']['version']} with every app's web version.\n")
          print(f"```sh\ndocker run --rm -p 8080:80 {image}:{os.environ['VERSION']}\n```\n")
          print("| App | Path | Version |\n|---|---|---|")
          for a in m["apps"]:
              print(f"| {a['name']} | `/{a['slug']}/` | {a.get('version', '-') if a.get('web') else 'no web version'} |")
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "craft-launcher-web $VERSION" --notes-file notes.md --latest="${{ steps.v.outputs.is_latest }}"
          fi
